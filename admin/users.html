<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colochess Admin - Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>body { background-color: #f4f6f9; }</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand font-weight-bold" href="dashboard.html">Colochess Admin</a>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Overview</a></li>
          <li class="nav-item active"><a class="nav-link" href="users.html">Users</a></li>
          <li class="nav-item"><a class="nav-link" href="withdrawals.html">Withdrawals</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings & Push</a></li>
        </ul>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>User Management</h2>
      <div class="form-inline">
        <input type="text" id="search-input" class="form-control mr-2" placeholder="Search name/email/device...">
        <button class="btn btn-primary" onclick="searchUsers()">Search</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Points</th>
              <th>Device ID</th>
              <th>Referral Code</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="8" class="text-center py-4">Loading users from D1...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    loadUsers();
    function searchUsers() {
      const q = document.getElementById('search-input').value.trim();
      loadUsers(1, q);
    }
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchUsers();
    });
  </script>
</body>
</html>
