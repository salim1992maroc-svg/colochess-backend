<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colochess Admin - Withdrawals</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>body { background-color: #f4f6f9; }</style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand font-weight-bold" href="dashboard.html">Colochess Admin</a>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Overview</a></li>
          <li class="nav-item"><a class="nav-link" href="users.html">Users</a></li>
          <li class="nav-item active"><a class="nav-link" href="withdrawals.html">Withdrawals</a></li>
          <li class="nav-item"><a class="nav-link" href="settings.html">Settings & Push</a></li>
        </ul>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Withdrawal Requests</h2>
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-warning active" id="btn-pending" onclick="filterStatus('pending')">Pending</button>
        <button type="button" class="btn btn-success" id="btn-completed" onclick="filterStatus('completed')">Completed</button>
        <button type="button" class="btn btn-danger" id="btn-refus" onclick="filterStatus('refus')">Refused</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover table-striped mb-0">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>User</th>
              <th>Method</th>
              <th>Payout / Points</th>
              <th>Account Details</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="withdrawals-tbody">
            <tr><td colspan="7" class="text-center py-4">Loading withdrawal records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    loadWithdrawals('pending');
    function filterStatus(status) {
      document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${status}`).classList.add('active');
      loadWithdrawals(status);
    }
  </script>
</body>
</html>
